/* src/estilos.css */
:root {
  --fondo: #0a0d11;
  --superficie: #12161d;
  --superficie-alta: #1a212a;
  --borde: #232b35;
  --borde-sutil: #1a212a;
  --texto: #edf0f3;
  --tenue: #7f8b98;
  --laborable: #63b6a6;
  --sdf: #d6a24a;
  --especial: #cf6f8d;
  --acento: #8c7cf2;
  --peligro: #d9827c;
  --celda: #0e1319;

  --serif: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "Segoe UI Mono", Consolas, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0; padding: 1.1rem 1rem 3rem;
  background: var(--fondo); color: var(--texto);
  font-family: var(--sans);
  font-size: 15px; line-height: 1.55;
  max-width: 560px; margin-inline: auto;
}

::selection { background: color-mix(in srgb, var(--acento) 35%, transparent); color: var(--texto); }

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--acento); outline-offset: 1px;
}

@media (prefers-reduced-motion: no-preference) {
  .tarjeta, button, #modal .caja { transition: border-color .15s ease, background-color .15s ease, transform .1s ease; }
}

/* Cabecera / marca */
.cabecera {
  padding: .25rem 0 1.1rem; display: flex;
  justify-content: space-between; align-items: flex-start; gap: .75rem;
}
.marca-grupo { display: flex; align-items: flex-start; gap: .65rem; }
.logo-app {
  width: 2.6rem; height: 2.6rem; border-radius: 50%; flex-shrink: 0;
  margin-top: .1rem;
}
h1.marca {
  margin: 0; font-family: var(--serif); font-weight: 600;
  font-size: 1.9rem; letter-spacing: -.01em; text-wrap: balance;
}
.engranaje {
  width: 2.2rem; height: 2.2rem; padding: 0; border-radius: 50%;
  font-size: 1rem; line-height: 1; color: var(--tenue); flex-shrink: 0;
}
.engranaje:hover { color: var(--texto); border-color: var(--tenue); }
.submarca {
  margin: .15rem 0 0; color: var(--tenue); font-size: 12.5px;
  font-family: var(--mono); letter-spacing: .02em;
}

/* Navegacion por pestanas: control segmentado */
.pestanas {
  display: flex; gap: 2px; margin-bottom: 1.1rem; flex-wrap: wrap;
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: 11px; padding: 3px;
}
.pestanas button {
  flex: 1 1 auto; border: none; background: none; color: var(--tenue);
  padding: .45rem .6rem; border-radius: 8px; font-size: 13.5px;
  font-weight: 500; text-transform: capitalize;
}
.pestanas button.activo { color: var(--fondo); background: var(--acento); }

/* Tarjetas */
.tarjeta {
  background: var(--superficie); border: 1px solid var(--borde);
  border-radius: 16px; padding: 1.15rem;
  margin-bottom: 1rem;
  box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 20px -12px rgba(0,0,0,.5);
}

.etiqueta {
  display: block; font-family: var(--sans); font-size: 11px;
  text-transform: uppercase; letter-spacing: .09em;
  color: var(--tenue); font-weight: 600;
  margin-bottom: .75rem;
}

.tenue { color: var(--tenue); }

/* Cabecera de mes */
.cabecera-mes { display: flex; justify-content: space-between; align-items: center; }
.mes-titulo {
  font-family: var(--serif); font-weight: 600; font-size: 1.25rem;
  text-transform: capitalize; letter-spacing: -.005em;
}
.mes-anio { color: var(--tenue); font-weight: 400; }
.nav-mes {
  width: 2rem; height: 2rem; padding: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; line-height: 1; color: var(--tenue);
}
.nav-mes:hover { color: var(--texto); border-color: var(--tenue); }

/* Calendario */
.rejilla { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cabecera-semana {
  color: var(--tenue); font-size: 11px; text-align: center;
  font-family: var(--mono); letter-spacing: .03em;
}
.dia {
  aspect-ratio: 1; border: 1px solid var(--borde-sutil); border-radius: 10px;
  background: var(--celda); padding: 4px; text-align: center; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px;
}
.dia:hover { border-color: var(--tenue); }
.dia .num { font-size: 13px; font-variant-numeric: tabular-nums; }
.dia .horas { font-size: 10px; color: var(--tenue); font-family: var(--mono); }
/* La declaracion plana va antes del color-mix como reserva: un navegador sin
   soporte descarta la segunda y conserva el color, en vez de perderlo entero. */
.dia.laborable { border-color: var(--laborable); border-color: color-mix(in srgb, var(--laborable) 55%, var(--borde)); background: #101a1d; background: color-mix(in srgb, var(--laborable) 10%, var(--celda)); }
.dia.sdf { border-color: var(--sdf); border-color: color-mix(in srgb, var(--sdf) 55%, var(--borde)); background: #1a1712; background: color-mix(in srgb, var(--sdf) 10%, var(--celda)); }
.dia.especial { border-color: var(--especial); border-color: color-mix(in srgb, var(--especial) 55%, var(--borde)); background: #1a1216; background: color-mix(in srgb, var(--especial) 12%, var(--celda)); }
.dia.laborable .num { color: var(--laborable); }
.dia.sdf .num { color: var(--sdf); }
.dia.especial .num { color: var(--especial); }
/* .hoy va DESPUES de las clases de tipo: misma especificidad, gana la ultima.
   Antes iba delante y el marcador desaparecia en los dias con guardia. */
.dia.hoy { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento) inset; }
.dia.hoy .num { color: var(--acento); font-weight: 600; }
.dia.prevista { border-style: dashed; }
.dia .lugar { font-size: 9px; color: var(--tenue); font-family: var(--mono); letter-spacing: .02em; }
.dia .cruza { font-size: 8.5px; color: var(--tenue); text-transform: uppercase; letter-spacing: .04em; }

/* Avisos */
.aviso {
  border-left: 2px solid var(--sdf); padding: .1rem .8rem;
  color: var(--tenue); font-size: 12.5px; margin: .85rem 0 0; line-height: 1.5;
}
.aviso button {
  font-size: 12px; padding: .15rem .55rem; margin-left: .3rem;
  vertical-align: middle;
}

/* Tablas y cifras */
table { width: 100%; border-collapse: collapse; }
td { padding: .38rem 0; font-size: 14px; }
td.cifra { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr:not(:last-child) td { border-bottom: 1px solid var(--borde-sutil); }
.total { color: var(--texto); font-weight: 600; }
.total.cifra, td.cifra.total {
  font-size: 1.35rem; font-family: var(--serif); font-weight: 600; color: var(--acento);
}
tr:has(.total) td { border-bottom: none; border-top: 1px solid var(--borde); padding-top: .6rem; }

.punto {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  margin-right: .45rem; vertical-align: middle;
}
.punto-laborable { background: var(--laborable); }
.punto-sdf { background: var(--sdf); }
.punto-especial { background: var(--especial); }

/* Modal */
#modal {
  position: fixed; inset: 0; background: rgba(5,7,10,.72); display: none;
  align-items: center; justify-content: center; padding: 1rem; z-index: 10;
  backdrop-filter: blur(3px);
}
#modal.abierto { display: flex; }
#modal .caja {
  background: var(--superficie-alta); border: 1px solid var(--borde); border-radius: 18px;
  padding: 1.35rem; max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 60px -20px rgba(0,0,0,.6);
}
.modal-fecha { display: block; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; margin-bottom: .9rem; }
.modal-fecha-grupo { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; }
.modal-fecha-grupo .modal-fecha { margin-bottom: 0; }
.logo-ajustes { width: 2.1rem; height: 2.1rem; border-radius: 50%; flex-shrink: 0; }
.cuenta-fila { display: flex; align-items: center; gap: .55rem; }
.avatar-cuenta { width: 1.9rem; height: 1.9rem; border-radius: 50%; flex-shrink: 0; }
.logo-bienvenida { width: 3.6rem; height: 3.6rem; border-radius: 50%; margin-bottom: .85rem; }
.etiqueta-campo {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--tenue); margin: 1rem 0 .4rem;
}
/* Solo dentro del modal: en una tarjeta el primer rotulo si necesita aire
   por encima, porque viene despues de una tabla o una lista. */
#modal .etiqueta-campo:first-of-type { margin-top: 0; }
.tarjeta .etiqueta-campo { margin-top: 1.4rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.acciones-modal { display: flex; gap: .5rem; margin-top: 1.25rem; }
.acciones-modal #m-guardar { margin-left: auto; }

.formulario { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .85rem; }

/* Controles */
button, input, select {
  background: var(--celda); color: var(--texto); border: 1px solid var(--borde);
  border-radius: 9px; padding: .5rem .75rem; font: inherit; font-size: 14px;
}
button { cursor: pointer; }

   Tema espacial. Ambientacion propia: no usa logotipos, tipografia

:root[data-tema="espacial"] {

/* Campo de estrellas: tres capas tileadas, sin imagenes ni JS. */
:root[data-tema="espacial"] body {

    radial-gradient(1.3px 1.3px at 30% 45%, rgba(180,215,255,.7), transparent),

  background-size: 340px 340px, 340px 340px, 500px 500px, 500px 500px,
                   260px 260px, 260px 260px, 700px 700px, 700px 700px,

/* Tipografia: Anton para el rotulo (grotesca condensada muy pesada) y News
   Cycle para todo lo demas, que desciende de News Gothic. */

<body>
<header class="cabecera">
  <div class="marca-grupo">

    <div>

    </div>
  </div>

<nav class="pestanas" id="pestanas"></nav>
<div id="vista"></div>
<div id="modal"><div class="caja" id="caja-modal"></div></div>

<script type="module">
function partes(fechaISO) {
  const [a, m, d] = fechaISO.split("-").map(Number);
  return { a, m, d };
}

function texto(a, m, d) {
  return `${a}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

function diaSemana(fechaISO) {
  const { a, m, d } = partes(fechaISO);
  return new Date(a, m - 1, d).getDay();
}

function desplazar(fechaISO, dias) {
  const { a, m, d } = partes(fechaISO);
  const x = new Date(a, m - 1, d + dias);
  return texto(x.getFullYear(), x.getMonth() + 1, x.getDate());
}

function diaSiguiente(fechaISO) {
  return desplazar(fechaISO, 1);
}

function aMinutos(hora) {
  const [h, m] = hora.split(":").map(Number);
  return h * 60 + m;
}

function aHora(minutos) {
  const dias = Math.floor(minutos / 1440);
  const resto = minutos - dias * 1440;
  if (resto === 0 && dias > 0) {
    return dias === 1 ? "24:00" : `24:00 +${dias - 1}`;
  }
  const h = String(Math.floor(resto / 60)).padStart(2, "0");
  const m = String(resto % 60).padStart(2, "0");
  return dias > 0 ? `${h}:${m} +${dias}` : `${h}:${m}`;
}

function mesDe(fechaISO) {
  return fechaISO.slice(0, 7);
}

function diasDelMes(anioMes) {
  const [a, m] = anioMes.split("-").map(Number);
  const cuantos = new Date(a, m, 0).getDate();
  return Array.from({ length: cuantos }, (_, i) => texto(a, m, i + 1));
}

function redondear(n) {
  return Math.round(n * 100) / 100;
}

// src/pascua.js

// Algoritmo anonimo gregoriano.
function domingoDePascua(anio) {
  const a = anio % 19;
  const b = Math.floor(anio / 100);
  const c = anio % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31);
  const dia = ((h + l - 7 * m + 114) % 31) + 1;
  return `${anio}-${String(mes).padStart(2, "0")}-${String(dia).padStart(2, "0")}`;
}

// src/tarifas.js

const RETRIBUCIONES_ANEXO = {
  guardias: {
    1: { laborable: 14.07, sdf: 15.78, especial: 28.14 },
    2: { laborable: 15.42, sdf: 17.28, especial: 30.84 },
    3: { laborable: 18.02, sdf: 20.17, especial: 36.04 },
    4: { laborable: 20.22, sdf: 22.61, especial: 40.44 },
    5: { laborable: 20.22, sdf: 22.61, especial: 40.44 },
  },
  sueldoBase: 1379.90,
  cgFormacion: { 1: 0, 2: 110.38, 3: 248.41, 4: 386.37, 5: 524.38 },
};

const PAGAS = 14;

function retribucionesDe(config) {
  return (config && config.retribuciones) || RETRIBUCIONES_ANEXO;
}

function anioResidenciaEn(fechaISO, inicioResidencia) {
  if (!inicioResidencia) return 1;
  const [ai, mi, di] = inicioResidencia.split("-").map(Number);
  const [af, mf, df] = fechaISO.split("-").map(Number);
  let anios = af - ai;
  if (mf < mi || (mf === mi && df < di)) anios -= 1;
  return Math.min(5, Math.max(1, anios + 1));
}

function tarifaEn(fechaISO, config) {
  const anio = anioResidenciaEn(fechaISO, config.inicioResidencia);
  return retribucionesDe(config).guardias[anio];
}

function retribucionFija(anioResidencia, config) {
  const r = retribucionesDe(config);
  const sueldo = r.sueldoBase;
  const cg = r.cgFormacion[anioResidencia];
  const mensual = redondear(sueldo + cg);
  return { sueldo, cg, mensual, anual: redondear(mensual * PAGAS) };
}

// src/festivos.js


const FIJOS_NACIONALES = [
  ["01-01", "Año Nuevo"],
  ["01-06", "Reyes"],
  ["05-01", "Fiesta del Trabajo"],
  ["08-15", "Asunción"],
  ["10-12", "Fiesta Nacional"],
  ["11-01", "Todos los Santos"],
  ["12-06", "Constitución"],
  ["12-08", "Inmaculada"],
  ["12-25", "Navidad"],
];

function festivosDerivados(anio) {
  const mapa = {};
  for (const [diaMes, nombre] of FIJOS_NACIONALES) {
    mapa[`${anio}-${diaMes}`] = { nombre, ambito: "nacional", clase: "sdf" };
  }
  const pascua = domingoDePascua(anio);
  mapa[desplazar(pascua, -2)] = { nombre: "Viernes Santo", ambito: "nacional", clase: "sdf" };
  mapa[`${anio}-02-28`] = { nombre: "Día de Andalucía", ambito: "autonomico", clase: "sdf" };
  mapa[desplazar(pascua, -3)] = { nombre: "Jueves Santo", ambito: "autonomico", clase: "sdf" };
  return mapa;
}

const cacheDerivados = new Map();

function derivadosDe(anio) {
  if (!cacheDerivados.has(anio)) cacheDerivados.set(anio, festivosDerivados(anio));
  return cacheDerivados.get(anio);
}

// `excepciones` guarda solo lo que el usuario ha tocado: una entrada con `nombre`
// que no esta en el calendario derivado es un alta local; una sin `nombre` es una
// reclasificacion de un festivo derivado.
function clasificarDia(fechaISO, excepciones = {}) {
  const marcado = excepciones[fechaISO];
  if (marcado && marcado.clase === "especial") return "especial";
  if (marcado && marcado.clase === "sdf") return "sdf";
  if (!marcado || marcado.clase !== "laborable") {
    if (derivadosDe(Number(fechaISO.slice(0, 4)))[fechaISO]) return "sdf";
  }
  const dia = diaSemana(fechaISO);
  return dia === 0 || dia === 6 ? "sdf" : "laborable";
}

function calendarioDe(anio, excepciones = {}) {
  // Se copia porque derivadosDe devuelve siempre la misma referencia cacheada:
  // sin la copia, una reclasificacion contaminaria las llamadas siguientes.
  const mapa = { ...derivadosDe(anio) };
  for (const [fecha, exc] of Object.entries(excepciones)) {
    if (Number(fecha.slice(0, 4)) !== anio) continue;
    if (mapa[fecha]) mapa[fecha] = { ...mapa[fecha], clase: exc.clase };
    else if (exc.nombre) mapa[fecha] = { nombre: exc.nombre, ambito: "local", clase: exc.clase };
  }
  return mapa;
}

// src/motor.js



const INICIO_POR_DURACION = { 7: "15:00", 8: "08:00", 12: "08:00", 15: "17:00", 17: "15:00", 24: "08:00" };

function inicioSugerido(horas) {
  return INICIO_POR_DURACION[horas] || "15:00";
}

// El horario no depende de la duracion sino del dia, y sale de dos reglas:
// se entra a las 15:00 si hoy se trabaja (despues de la jornada ordinaria) o a
// las 09:00 si no; y se sale a las 08:00 si manana se trabaja o a las 09:00 si
// no. De ahi salen los cuatro casos reales (L-J 17h, V 18h, S 24h, D 23h) y
// ademas quedan resueltos los festivos entre semana sin tabla aparte.
function sugerenciaPara(fechaISO, festivos = {}) {
  const seTrabajaHoy = clasificarDia(fechaISO, festivos) === "laborable";
  const seTrabajaManana = clasificarDia(diaSiguiente(fechaISO), festivos) === "laborable";
  const inicio = seTrabajaHoy ? "15:00" : "09:00";
  const fin = seTrabajaManana ? "08:00" : "09:00";
  return { horas: (aMinutos(fin) + 1440 - aMinutos(inicio)) / 60, inicio };
}

// `festivos` es el mapa de excepciones del usuario, no un calendario completo:
// el calendario base lo deriva festivos.js a partir del anio de cada fecha.
function partirGuardia(guardia, festivos, opciones = {}) {
  const cortar = opciones.cortarAMedianoche !== false;
  const cortarEspecial = opciones.especialCortaAMedianoche !== false;
  const inicio = aMinutos(guardia.inicio || inicioSugerido(guardia.horas));
  const total = Math.round(guardia.horas * 60);
  const tipoInicial = clasificarDia(guardia.fecha, festivos);

  const enteraComoInicio =
    !cortar || (!cortarEspecial && tipoInicial === "especial");

  if (enteraComoInicio) {
    return [{
      fecha: guardia.fecha,
      desde: aHora(inicio),
      hasta: aHora(inicio + total),
      horas: guardia.horas,
      tipo: tipoInicial,
    }];
  }

  const tramos = [];
  let fecha = guardia.fecha;
  let desde = inicio;
  let restante = total;
  while (restante > 0) {
    const enEsteDia = Math.min(restante, 1440 - desde);
    tramos.push({
      fecha,
      desde: aHora(desde),
      hasta: aHora(desde + enEsteDia),
      horas: enEsteDia / 60,
      tipo: clasificarDia(fecha, festivos),
    });
    restante -= enEsteDia;
    desde = 0;
    fecha = diaSiguiente(fecha);
  }
  return tramos;
}

function calcularGuardia(guardia, festivos, config) {
  const tramos = partirGuardia(guardia, festivos, config);
  const horasPorTipo = { laborable: 0, sdf: 0, especial: 0 };
  const importePorTipo = { laborable: 0, sdf: 0, especial: 0 };

  const detallados = tramos.map((t) => {
    const tarifa = tarifaEn(t.fecha, config)[t.tipo];
    const importe = redondear(t.horas * tarifa);
    horasPorTipo[t.tipo] += t.horas;
    importePorTipo[t.tipo] = redondear(importePorTipo[t.tipo] + importe);
    return { ...t, tarifa, importe };
  });

  const bruto = redondear(
    importePorTipo.laborable + importePorTipo.sdf + importePorTipo.especial);
  return { tramos: detallados, horasPorTipo, importePorTipo, bruto };
}

// src/nomina.js



// La mas reciente, no la media: el IRPF se recalcula cada anio y sube con el anio
// de residencia, asi que promediar una nomina de R1 con una de R3 da un tipo que no
// describe a ninguna de las dos.
function tipoReciente(nominas, clase) {
  const suyas = nominas.filter((n) => n.clase === clase && n.bruto > 0);
  if (suyas.length === 0) return null;
  let mejor = suyas[0];
  for (const n of suyas) {
    if (n.periodo >= mejor.periodo) mejor = n; // >= : la ultima anadida gana el empate
  }
  return Math.round(((mejor.bruto - mejor.neto) / mejor.bruto) * 1e6) / 1e6;
}

function tiposEfectivos(nominas, config) {
  const base = tipoReciente(nominas, "base");
  const guardias = tipoReciente(nominas, "guardias");
  return {
    base: base === null ? config.retencionBase : base,
    guardias: guardias === null ? config.retencionGuardias : guardias,
    nBase: nominas.filter((n) => n.clase === "base").length,
    nGuardias: nominas.filter((n) => n.clase === "guardias").length,
  };
}

// El tipo de IRPF se regulariza y puede moverse de un mes a otro, sobre todo con
// retribucion variable como las guardias. El historial deja ver la deriva, y
// `esSalto` marca los cambios grandes, que suelen ser una regularizacion.
const SALTO_MINIMO = 0.01; // un punto porcentual

const tasa = (parte, bruto) => Math.round((parte / bruto) * 1e6) / 1e6;

function historialTipos(nominas, clase) {
  const suyas = nominas
    .filter((n) => n.clase === clase && n.bruto > 0)
    .slice()
    .sort((a, b) => (a.periodo < b.periodo ? -1 : a.periodo > b.periodo ? 1 : 0));
  let anterior = null;      // valor de referencia de la nomina previa
  let anteriorEsIrpf = null; // de que tipo era, para no comparar peras con manzanas
  return suyas.map((n) => {
    const descontado = n.bruto - n.neto;
    const tipo = tasa(descontado, n.bruto);
    const desglosada = n.cotizacion != null && n.irpf != null;
    const tipoCotizacion = desglosada ? tasa(n.cotizacion, n.bruto) : null;
    const tipoIrpf = desglosada ? tasa(n.irpf, n.bruto) : null;

    // La cotizacion va a tipo fijo por ley: lo que deriva es el IRPF. Cuando hay
    // desglose se vigila ese, que es donde esta la senal; si no, el total.
    const referencia = desglosada ? tipoIrpf : tipo;
    const esIrpf = desglosada;
    const comparable = anterior !== null && anteriorEsIrpf === esIrpf;
    const salto = comparable ? Math.round((referencia - anterior) * 1e6) / 1e6 : null;

    const fila = {
      periodo: n.periodo,
      bruto: n.bruto,
      tipo,
      tipoCotizacion,
      tipoIrpf,
      // Un céntimo de margen: los redondeos de la nomina no tienen por que cuadrar exactos.
      cuadra: !desglosada || Math.abs(n.cotizacion + n.irpf - descontado) <= 0.02,
      salto,
      esSalto: salto !== null && Math.abs(salto) >= SALTO_MINIMO,
    };
    anterior = referencia;
    anteriorEsIrpf = esIrpf;
    return fila;
  });
}

function aplicarRetencion(bruto, tipo) {
  const descuento = redondear(bruto * tipo);
  return { descuento, neto: redondear(bruto - descuento) };
}

function mesAnterior(anioMes) {
  const [a, m] = anioMes.split("-").map(Number);
  return m === 1
    ? `${a - 1}-12`
    : `${a}-${String(m - 1).padStart(2, "0")}`;
}

function resumenMes(anioMes, estado) {
  const tipos = tiposEfectivos(estado.nominas, estado.config);
  const anio = anioResidenciaEn(`${anioMes}-15`, estado.config.inicioResidencia);
  const brutoBase = retribucionFija(anio, estado.config).mensual;

  const horasPorTipo = { laborable: 0, sdf: 0, especial: 0 };
  const importePorTipo = { laborable: 0, sdf: 0, especial: 0 };
  let nGuardias = 0;
  let brutoConfirmado = 0;

  for (const [fecha, guardia] of Object.entries(estado.guardias)) {
    if (mesDe(fecha) !== anioMes) continue;
    nGuardias += 1;
    const r = calcularGuardia({ ...guardia, fecha }, estado.festivos, estado.config);
    for (const tipo of ["laborable", "sdf", "especial"]) {
      horasPorTipo[tipo] += r.horasPorTipo[tipo];
      importePorTipo[tipo] = redondear(importePorTipo[tipo] + r.importePorTipo[tipo]);
    }
    if (guardia.hecha) brutoConfirmado = redondear(brutoConfirmado + r.bruto);
  }

  const brutoGuardias = redondear(
    importePorTipo.laborable + importePorTipo.sdf + importePorTipo.especial);
  const base = aplicarRetencion(brutoBase, tipos.base);
  const guardias = aplicarRetencion(brutoGuardias, tipos.guardias);

  return {
    anioMes, nGuardias, horasPorTipo, importePorTipo,
    brutoBase, brutoGuardias, bruto: redondear(brutoBase + brutoGuardias),
    brutoConfirmado,
    // Restado, no sumado aparte: asi las dos partes cuadran siempre con el total
    // aunque los redondeos por tipo y por guardia difieran en algun centimo.
    brutoPrevisto: redondear(brutoGuardias - brutoConfirmado),
    netoBase: base.neto, netoGuardias: guardias.neto,
    neto: redondear(base.neto + guardias.neto),
  };
}

function previsionIngreso(anioMes, estado) {
  const deEsteMes = resumenMes(anioMes, estado);
  const guardiasDe = mesAnterior(anioMes);
  const delAnterior = resumenMes(guardiasDe, estado);
  return {
    anioMes,
    base: deEsteMes.netoBase,
    guardiasDe,
    importeGuardias: delAnterior.netoGuardias,
    total: redondear(deEsteMes.netoBase + delAnterior.netoGuardias),
  };
}

function resumenAnio(anio, estado) {
  const meses = Array.from({ length: 12 }, (_, i) =>
    resumenMes(`${anio}-${String(i + 1).padStart(2, "0")}`, estado));
  const horasPorTipo = { laborable: 0, sdf: 0, especial: 0 };
  let bruto = 0;
  let neto = 0;
  for (const m of meses) {
    for (const tipo of ["laborable", "sdf", "especial"]) {
      horasPorTipo[tipo] += m.horasPorTipo[tipo];
    }
    bruto = redondear(bruto + m.bruto);
    neto = redondear(neto + m.neto);
  }
  return { meses, horasPorTipo, bruto, neto };
}

function compararHipotesis(anioMes, estado) {
  const con = resumenMes(anioMes, {
    ...estado, config: { ...estado.config, cortarAMedianoche: true },
  });
  const sin = resumenMes(anioMes, {
    ...estado, config: { ...estado.config, cortarAMedianoche: false },
  });
  const diferencia = redondear(Math.abs(con.brutoGuardias - sin.brutoGuardias));
  return {
    conCorte: { horasPorTipo: con.horasPorTipo, brutoGuardias: con.brutoGuardias },
    sinCorte: { horasPorTipo: sin.horasPorTipo, brutoGuardias: sin.brutoGuardias },
    difieren: diferencia !== 0,
    diferencia,
  };
}

// src/nomina-pdf.js
//
// Lee el "Justificante de nómina" en PDF del SAS (Junta de Andalucía) y
// extrae los campos que hacen falta en la pestaña Nóminas. Es una plantilla
// de tabla fija generada por el mismo sistema cada mes, así que un parseo
// por etiqueta ("Total devengos:", "Líquido a percibir:"...) es más fiable
// que leer la tabla de conceptos por posición: un extractor de texto puede
// agrupar columnas enteras de una tabla y desordenar las filas, pero los
// pares "Etiqueta: valor" de cabecera se mantienen pegados.

const CDN_PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.7.76";

let pdfjsPromesa = null;

// pdf.js se carga con import() dinámico, igual que el SDK de Firebase en
// nube.js: si falla por falta de red, no tumba el resto de la app — solo
// falla el botón de importar PDF, y el alta manual sigue funcionando. Si el
// intento falla, no se memoriza el rechazo: se limpia para que el siguiente
// PDF que se suba vuelva a intentar la carga en vez de fallar para siempre
// por un corte de red puntual.
function cargarPdfjs() {
  if (!pdfjsPromesa) {
    pdfjsPromesa = import(`${CDN_PDFJS}/pdf.min.mjs`).then((pdfjs) => {
      pdfjs.GlobalWorkerOptions.workerSrc = `${CDN_PDFJS}/pdf.worker.min.mjs`;
      return pdfjs;
    }).catch((e) => {
      pdfjsPromesa = null;
      throw e;
    });
  }
  return pdfjsPromesa;
}

async function extraerTextoPdf(arrayBuffer) {
  const pdfjs = await cargarPdfjs();
  const doc = await pdfjs.getDocument({ data: arrayBuffer }).promise;
  const pagina = await doc.getPage(1);
  const contenido = await pagina.getTextContent();
  return contenido.items.map((it) => it.str).join(" ");
}

// El SAS solo emite estos dos tipos para un residente: la nómina Normal (el
// sueldo fijo del mes) y la Complementaria (liquidación de guardias del mes
// anterior). Cualquier otro valor se rechaza en vez de adivinar la clase.
const CLASE_POR_EMISION = { Normal: "base", Complementaria: "guardias" };

function numero(texto) {
  return Number(texto.replace(/\./g, "").replace(",", "."));
}

function capturar(texto, patron, etiqueta) {
  const m = texto.match(patron);
  if (!m) throw new Error(`No se encontró "${etiqueta}" en el PDF.`);
  return m;
}

function parsearNomina(texto) {
  const [, tipoEmision] = capturar(
    texto, /Tip\.n[oó]m\.emisi[oó]n:\s*(\S+)/i, "Tip.nóm.emisión");
  const clase = CLASE_POR_EMISION[tipoEmision];
  if (!clase) throw new Error(`Tipo de nómina no reconocido: "${tipoEmision}".`);

  const [, diaIni, mes, anio, diaFin, mesFin, anioFin] = capturar(
    texto,
    /Periodo liquidaci[oó]n:\s*(\d{2})\/(\d{2})\/(\d{4})\s*al\s*(\d{2})\/(\d{2})\/(\d{4})/i,
    "Periodo liquidación");
  // Todas las nominas reales vistas hasta ahora liquidan un mes natural
  // completo. Si algun dia el SAS emite un periodo partido entre dos meses
  // (p.ej. un alta o baja a mitad de mes), no hay forma fiable de decidir
  // solo el aqui a que mes natural pertenece — mejor rechazarlo y que se
  // registre a mano, con criterio, que adivinar.
  if (mes !== mesFin || anio !== anioFin) {
    throw new Error(
      `El periodo de liquidación (${diaIni}/${mes}/${anio} al ${diaFin}/${mesFin}/${anioFin}) `
      + "no cae en un solo mes natural: regístrala a mano.");
  }
  const periodo = `${anio}-${mes}`;

  const [, brutoTexto] = capturar(texto, /Total devengos:\s*([\d.,]+)/i, "Total devengos");
  const [, descuentosTexto] = capturar(
    texto, /Total descuentos:\s*([\d.,]+)/i, "Total descuentos");
  const [, netoTexto] = capturar(
    texto, /L[ií]quido a percibir:\s*([\d.,]+)/i, "Líquido a percibir");

  // Hasta la primera regularización del residente el IRPF es 0 y el total de
  // descuentos es íntegro cotización (así en todas las nóminas reales vistas
  // hasta ahora). Si algún mes deja de ser así, el paso de revisión antes de
  // guardar (en la UI) es donde se corrige a mano, igual que en el alta
  // manual — no hace falta adivinarlo aquí.
  return {
    periodo, clase,
    bruto: numero(brutoTexto),
    neto: numero(netoTexto),
    cotizacion: numero(descuentosTexto),
    irpf: 0,
  };
}

// src/estado.js

const CLAVE = "cuadrante_v6";
const CLAVE_V5 = "cuadrante_v5";
const CLAVE_PREVIO = "cuadrante_v6_previo";

function estadoInicial() {
  return {
    version: 6,
    actualizadoEn: 0,
    config: {
      inicioResidencia: null,
      cortarAMedianoche: true,
      especialCortaAMedianoche: true,
      retencionBase: 0.089753,
      retencionGuardias: 0.032609,
      retribuciones: null,
      tema: "espacial", // "sobrio" | "espacial"
    },
    guardias: {},
    festivos: {},
    nominas: [],
  };
}

// v5 guardaba el calendario de festivos entero; v6 solo guarda las diferencias
// contra el calendario derivado, para que las mejoras del codigo sigan llegando.
function migrarV5(v5) {
  const inicial = estadoInicial();
  const festivos = {};
  for (const [fecha, f] of Object.entries(v5.festivos || {})) {
    const derivado = festivosDerivados(Number(fecha.slice(0, 4)))[fecha];
    if (derivado) {
      if (f.clase !== derivado.clase) festivos[fecha] = { clase: f.clase };
    } else if (f.clase !== "laborable") {
      festivos[fecha] = { nombre: f.nombre, clase: f.clase };
    }
  }
  return {
    ...inicial,
    config: { ...inicial.config, ...(v5.config || {}), retribuciones: null },
    guardias: v5.guardias || {},
    festivos,
    nominas: v5.nominas || [],
  };
}

const ES_FECHA = /^\d{4}-\d{2}-\d{2}$/;
const ES_HORA = /^([01]\d|2[0-3]):[0-5]\d$/;
const ES_PERIODO = /^\d{4}-\d{2}$/;

function guardiaValida(fecha, g) {
  return ES_FECHA.test(fecha) && g && typeof g === "object"
    && typeof g.horas === "number" && g.horas > 0 && g.horas <= 48
    && (g.inicio === undefined || ES_HORA.test(g.inicio));
}

function nominaValida(n) {
  return n && typeof n === "object"
    && ES_PERIODO.test(n.periodo)
    && (n.clase === "base" || n.clase === "guardias")
    && typeof n.bruto === "number" && n.bruto > 0
    && typeof n.neto === "number" && n.neto > 0 && n.neto <= n.bruto;
}

const CLASES_FESTIVO = ["laborable", "sdf", "especial"];

function festivoValido(fecha, f) {
  return ES_FECHA.test(fecha) && f && typeof f === "object"
    && CLASES_FESTIVO.includes(f.clase)
    && (f.nombre === undefined || typeof f.nombre === "string");
}

// Importa una copia de seguridad pegada a mano. Descarta lo que no sea valido en
// vez de rechazar el lote entero: una copia casi buena sigue sirviendo, y se
// informa de cuantas entradas se han caido. El tema no se importa a proposito:
// es una preferencia de cada dispositivo, no un dato del usuario.
function importarEstado(texto) {
  let dato;
  try {
    dato = JSON.parse(texto);
  } catch {
    return { ok: false, error: "Eso no es un JSON valido." };
  }
  if (!dato || typeof dato !== "object" || Array.isArray(dato)) {
    return { ok: false, error: "Eso no es una copia del cuadrante." };
  }
  if (!dato.config || typeof dato.config !== "object"
      || !dato.guardias || typeof dato.guardias !== "object" || Array.isArray(dato.guardias)) {
    return { ok: false, error: "A esa copia le faltan datos del cuadrante." };
  }

  const base = Number(dato.version) >= 6 ? dato : migrarV5(dato);
  const inicial = estadoInicial();
  let descartadas = 0;

  const guardias = {};
  for (const [fecha, g] of Object.entries(base.guardias || {})) {
    if (guardiaValida(fecha, g)) guardias[fecha] = g;
    else descartadas += 1;
  }

  const nominas = [];
  for (const n of Array.isArray(base.nominas) ? base.nominas : []) {
    if (nominaValida(n)) nominas.push(n);
    else descartadas += 1;
  }

  const config = { ...inicial.config, ...(base.config || {}) };
  delete config.tema;
  // Una fecha de inicio con formato raro romperia el calculo del anio de
  // residencia (NaN silencioso en las tarifas): si no es una fecha valida,
  // se descarta y se vuelve a preguntar.
  if (config.inicioResidencia != null && !ES_FECHA.test(config.inicioResidencia)) {
    config.inicioResidencia = null;
  }

  const festivos = {};
  for (const [fecha, f] of Object.entries(base.festivos || {})) {
    if (festivoValido(fecha, f)) festivos[fecha] = f;
    else descartadas += 1;
  }

  return {
    ok: true,
    descartadas,
    estado: {
      ...inicial,
      config,
      guardias,
      festivos,
      nominas,
      version: 6,
    },
  };
}

function leerJSON(almacen, clave) {
  try {
    const crudo = almacen.getItem(clave);
    if (!crudo) return null;
    const dato = JSON.parse(crudo);
    return dato && typeof dato === "object" ? dato : null;
  } catch {
    return null;
  }
}

// Copia del ultimo estado local antes de que una adopcion remota lo pise. Es
// el respaldo para "restaurar mi copia anterior": vive solo en este
// dispositivo (no viaja a la nube) y la siguiente adopcion la sobrescribe.
function guardarPrevio(almacen, estado) {
  try { almacen.setItem(CLAVE_PREVIO, JSON.stringify(estado)); } catch { /* sin espacio: no pasa nada */ }
}

function cargarPrevio(almacen) {
  return leerJSON(almacen, CLAVE_PREVIO);
}

// Compara solo los datos del usuario (config sin el tema, guardias, festivos,
// nominas), ignorando lo que es de cada dispositivo o una marca de tiempo:
// sirve para saber si una adopcion remota va a descartar ediciones locales.
function mismaData(a, b) {
  if (!a || !b) return false;
  const datos = (e) => {
    const { tema, ...config } = e.config || {};
    return JSON.stringify({
      config,
      guardias: e.guardias || {},
      festivos: e.festivos || {},
      nominas: e.nominas || [],
    });
  };
  return datos(a) === datos(b);
}

// Rellena con el estado inicial las claves que falten en un dato guardado o
// recibido: asi quien no toca una preferencia sigue recibiendo las mejoras
// futuras del codigo en vez de congelar una copia incompleta.
function normalizar(dato) {
  const inicial = estadoInicial();
  return {
    ...inicial,
    ...dato,
    config: { ...inicial.config, ...(dato.config || {}) },
  };
}

function cargar(almacen) {
  const guardado = leerJSON(almacen, CLAVE);
  if (guardado) return normalizar(guardado);
  const v5 = leerJSON(almacen, CLAVE_V5);
  return v5 ? migrarV5(v5) : estadoInicial();
}

function guardar(almacen, estado) {
  almacen.setItem(CLAVE, JSON.stringify(estado));
}

// src/persistencia.js
//
// El cuadrante vive en un Artifact, y el iframe donde se sirve es de
// terceros para el navegador (frame.claudeusercontent.com dentro de
// claude.ai). Los navegadores moviles, sobre todo Safari, pueden purgar el
// localStorage de un iframe de terceros entre sesiones: por eso las
// guardias desaparecian al cerrar y volver a abrir en el movil.
//
// Ademas de localStorage (instantaneo, por dispositivo), este modulo guarda
// una copia en el propio Artifact usando la capacidad "artifact": vive en
// el servidor, no en el navegador, y sobrevive a esa purga. Si la capacidad
// no esta disponible (fuera de un Artifact, en un visor de solo lectura, o
// en los tests, donde no existe `window`), se queda solo con localStorage,
// igual que antes.
const RUTA = "data/estado.json";
const ESPERA_MS = 2500;

async function capacidad() {
  if (typeof window === "undefined" || !window.claude
      || typeof window.claude.use !== "function") return null;
  try {
    return await window.claude.use("artifact");
  } catch {
    return null;
  }
}

async function cargarRemoto() {
  if (!(await capacidad())) return null;
  try {
    const resp = await fetch(RUTA);
    if (!resp.ok) return null;
    const dato = await resp.json();
    return dato && typeof dato === "object" && !Array.isArray(dato) ? dato : null;
  } catch {
    return null;
  }
}

// El guardado remoto tiene debounce (ver mas abajo): si se cierra el
// navegador justo despues de editar, el ultimo cambio puede quedarse solo en
// localStorage sin llegar a publicarse. Por eso el remoto NO gana siempre al
// cargar: solo se adopta si es mas reciente que lo que ya hay en este
// dispositivo. `actualizadoEn` es una marca de tiempo que ui.js pone al
// persistir cada cambio.
function esMasReciente(remoto, local) {
  return (remoto && remoto.actualizadoEn || 0) > (local && local.actualizadoEn || 0);
}

// Debounced: publicar en el Artifact crea una version nueva cada vez, asi
// que no conviene hacerlo en cada tecla. Se espera una pausa antes de enviar,
// pero si la pestana se oculta o se cierra antes de que venza la pausa se
// envia de inmediato, para no perder el ultimo cambio.
//
// `alCambiarEstado(estado)` (opcional) se llama cada vez que cambia el estado
// del guardado, para que la interfaz pueda mostrarlo. La funcion devuelta
// tambien expone `.estadoActual` con el ultimo valor, por si hace falta
// leerlo sin esperar al siguiente cambio (por ejemplo al abrir Ajustes).
// Valores posibles: "comprobando", "al-dia", "pendiente", "no-disponible".
function creaGuardadoRemoto(alCambiarEstado) {
  let temporizador = null;
  let ultimoEnviado = null;
  let pendiente = null;
  let estado = "comprobando";

  function fijarEstado(nuevo) {
    if (nuevo === estado) return;
    estado = nuevo;
    if (typeof alCambiarEstado === "function") alCambiarEstado(estado);
  }

  capacidad().then((artifact) => {
    // Si mientras tanto ya se ha programado o resuelto un envio, ese estado manda.
    if (estado === "comprobando") fijarEstado(artifact ? "al-dia" : "no-disponible");
  });

  async function enviar(datoAGuardar) {
    const artifact = await capacidad();
    if (!artifact) { fijarEstado("no-disponible"); return; }
    const contenido = JSON.stringify(datoAGuardar);
    if (contenido === ultimoEnviado) { fijarEstado("al-dia"); return; }
    try {
      await artifact.publish({ [RUTA]: contenido });
      ultimoEnviado = contenido;
      fijarEstado("al-dia");
    } catch {
      // Sin red, sin permiso de escritura, o conflicto con otra pestana: el
      // dato sigue a salvo en localStorage y se reintenta en el proximo cambio.
      fijarEstado("no-disponible");
    }
  }

  function forzar() {
    if (pendiente === null) return;
    clearTimeout(temporizador);
    const datoAGuardar = pendiente;
    pendiente = null;
    enviar(datoAGuardar);
  }

  if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") forzar();
    });
    document.addEventListener("pagehide", forzar);
  }

  function programar(datoAGuardar) {
    pendiente = datoAGuardar;
    fijarEstado("pendiente");
    clearTimeout(temporizador);
    temporizador = setTimeout(forzar, ESPERA_MS);
  }

  Object.defineProperty(programar, "estadoActual", { get: () => estado });
  return programar;
}

// Sincronizacion con Firebase (Auth con Google + Firestore), para cuando la

let sdkPromesa = null;

// Modo standalone (app anadida a pantalla de inicio en iOS): ahi no existe
// ventana para el popup, asi que el login tiene que ir por redireccion.
// `navigator.standalone` es la propiedad de iOS; `display-mode: standalone`
// cubre el resto. En una pestana normal de Safari (no standalone) el popup
// SI funciona con un gesto directo del usuario, y conviene usarlo: el
// redirect depende de que Firebase recupere el estado pendiente tras la
// vuelta a traves de storage de terceros (authDomain distinto del dominio de
// la app), que Safari puede bloquear por ITP — entonces getRedirectResult
// no rechaza, simplemente vuelve sin sesion y sin error, como si "no hubiera
// pasado nada". Verificado en vivo el 31/08/2026: en una pestana normal de
// Safari en iPhone, el login por redireccion llega a ver la pantalla de
// Google y confirma la cuenta, pero vuelve sin sesion iniciada.
function esStandalone() {
  return typeof navigator !== "undefined" && (
    navigator.standalone === true
    || (typeof window !== "undefined" && typeof window.matchMedia === "function"
        && window.matchMedia("(display-mode: standalone)").matches)
  );
}

function cargarSDK() {
  if (!sdkPromesa) {
    sdkPromesa = Promise.all([
      import(`${CDN}/firebase-app.js`),
      import(`${CDN}/firebase-auth.js`),
      import(`${CDN}/firebase-firestore.js`),
    ]).then(([appMod, authMod, fsMod]) => {
      const app = appMod.initializeApp(CONFIG);
      return { auth: authMod.getAuth(app), db: fsMod.getFirestore(app), authMod, fsMod };
    }).catch(() => null);
  }
  return sdkPromesa;
}

// Llama a `fn(usuario | null)` cada vez que cambia la sesion. `usuario` es
// `{ uid, nombre, correo, foto }` o `null` si no hay sesion. Si el SDK no
// carga (sin red), se llama una vez con null y ya esta.
function alCambiarSesion(fn, alErrorRedireccion) {
  cargarSDK().then((f) => {
    if (!f) { fn(null); return; }
    f.authMod.onAuthStateChanged(f.auth, (u) => {
      fn(u ? { uid: u.uid, nombre: u.displayName, correo: u.email, foto: u.photoURL } : null);
    });
    // Si venimos de un login por redireccion (iOS), la sesion se restaura
    // igual por onAuthStateChanged, pero getRedirectResult cierra el flujo y
    // puede rechazar con el motivo real (dominio no autorizado, almacenamiento
    // bloqueado por Safari, etc.): se reporta en vez de descartarse en
    // silencio, para poder diagnosticar el login atascado en el movil.
    f.authMod.getRedirectResult(f.auth).catch((err) => {
      if (typeof alErrorRedireccion === "function") alErrorRedireccion(err);
    });
  });
}

async function iniciarSesion() {
  const f = await cargarSDK();
  if (!f) throw new Error("Sin conexion: no se puede iniciar sesion ahora mismo.");
  const proveedor = new f.authMod.GoogleAuthProvider();
  if (esStandalone()) {
    // Solo aqui hace falta redireccion: en standalone no hay ventana donde
    // abrir el popup.
    await f.authMod.signInWithRedirect(f.auth, proveedor);
    return; // la redireccion recarga la pagina; esto no llega a ejecutarse
  }
  await f.authMod.signInWithPopup(f.auth, proveedor);
}

async function cerrarSesion() {
  const f = await cargarSDK();
  if (!f) return;
  await f.authMod.signOut(f.auth);
}

async function uidActual() {
  const f = await cargarSDK();
  return f && f.auth.currentUser ? { f, uid: f.auth.currentUser.uid } : null;
}

// Nombrada distinto de la del Artifact (`cargarRemoto` en persistencia.js):
// build.mjs concatena todos los modulos en un unico script, y un alias en el
// `import` de ui.js no evita el choque de nombres a nivel superior — hacen
// falta nombres de verdad distintos en el propio archivo.
async function cargarNube() {
  const act = await uidActual();
  if (!act) return null;
  const { f, uid } = act;
  try {
    const snap = await f.fsMod.getDoc(f.fsMod.doc(f.db, "usuarios", uid));
    return snap.exists() ? snap.data() : null;
  } catch {
    return null;
  }
}

// `esMasReciente` (la logica de "gana quien sea mas reciente") se reutiliza
// de persistencia.js: es la misma funcion pura, y por el mismo motivo de
// arriba no puede haber una segunda declaracion con el mismo nombre aqui.

// Debounced + envio inmediato al ocultar la pestana, igual que el guardado
// en el Artifact. `alCambiarEstado(estado)` recibe "comprobando" / "al-dia" /
// "pendiente" / "no-disponible" (no-disponible tambien cuando no hay sesion).
function creaGuardadoNube(alCambiarEstado) {
  let temporizador = null;
  let ultimoEnviado = null;
  let ultimoUid = null;
  let pendiente = null;
  let estado = "comprobando";

  function fijarEstado(nuevo) {
    if (nuevo === estado) return;
    estado = nuevo;
    if (typeof alCambiarEstado === "function") alCambiarEstado(estado);
  }

  // Si al arrancar ya hay sesion (usuario que volvio), que el aviso empiece
  // en "al dia" (nada pendiente) en vez de quedarse en "no disponible" hasta
  // el primer cambio, que seria enganoso teniendo sesion. Ojo: dos intentos
  // anteriores (mirar `currentUser` justo tras cargar el SDK, y despues
  // esperar a un solo `onAuthStateChanged`/`authStateReady()`) seguian
  // dejando el aviso encasquillado en "no disponible" — verificado en vivo
  // las dos veces: la sesion persistida puede tardar en resolverse mas de lo
  // que cualquiera de esas señales garantiza, y cualquier comprobacion de
  // "una sola vez" puede caer justo antes de que se resuelva. La solucion no
  // es afinar CUANDO se comprueba, sino no fiarse nunca de un "no hay
  // sesion" que salga de aqui: este listener se queda escuchando
  // indefinidamente (no una vez) y solo corrige el aviso hacia "al dia" en
  // cuanto aparece un usuario real, aunque sea tarde. El "no disponible" por
  // ausencia de sesion solo se declara tras un plazo de gracia sin que
  // aparezca nadie — y si la sesion llega despues de todos modos, este mismo
  // listener lo corrige.
  cargarSDK().then((f) => {
    if (!f) { if (estado === "comprobando") fijarEstado("no-disponible"); return; }
    f.authMod.onAuthStateChanged(f.auth, (u) => {
      if (u && (estado === "comprobando" || estado === "no-disponible")) fijarEstado("al-dia");
    });
    setTimeout(() => {
      if (estado === "comprobando") fijarEstado("no-disponible");
    }, 8000);
  });

  async function enviar(datoAGuardar) {
    const act = await uidActual();
    if (!act) { fijarEstado("no-disponible"); return; }
    const { f, uid } = act;
    // Si ha cambiado de cuenta (cerrar sesion + entrar con otra Google
    // distinta) sin que el estado local haya cambiado, no hay que confiar
    // en el "ya esta enviado" de la cuenta anterior.
    if (uid !== ultimoUid) { ultimoEnviado = null; ultimoUid = uid; }
    const contenido = JSON.stringify(datoAGuardar);
    if (contenido === ultimoEnviado) { fijarEstado("al-dia"); return; }
    try {
      await f.fsMod.setDoc(f.fsMod.doc(f.db, "usuarios", uid), datoAGuardar);
      ultimoEnviado = contenido;
      fijarEstado("al-dia");
    } catch {
      fijarEstado("no-disponible");
    }
  }

  function forzar() {
    if (pendiente === null) return;
    clearTimeout(temporizador);
    const datoAGuardar = pendiente;
    pendiente = null;
    enviar(datoAGuardar);
  }

  if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") forzar();
    });
    document.addEventListener("pagehide", forzar);
  }

  function programar(datoAGuardar) {
    pendiente = datoAGuardar;
    fijarEstado("pendiente");
    clearTimeout(temporizador);
    temporizador = setTimeout(forzar, 2500);
  }

  Object.defineProperty(programar, "estadoActual", { get: () => estado });
  return programar;
}

const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio",
  "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
// La clave es interna (sin tildes, se usa como estado); el texto es lo que se lee.
const PESTANAS = [
  { clave: "calendario", texto: "Calendario" },
  { clave: "festivos", texto: "Festivos" },
  { clave: "nominas", texto: "Nóminas" },
  { clave: "anual", texto: "Anual" },
];
const DURACIONES = [7, 8, 12, 15, 17, 18, 23, 24];
const LUGARES = [
  { sigla: "URG", nombre: "Puerta de Urgencias" },
  { sigla: "OBS", nombre: "Observación" },
  { sigla: "PT", nombre: "Puerta de Trauma" },
  { sigla: "DSS", nombre: "Deccu Sector Sur" },
  { sigla: "DCP", nombre: "Deccu Castilla del Pino" },
];
const AVISO_SIN_VERIFICAR =
  "Regla del corte a medianoche sin verificar. Se confirma con la nómina de septiembre.";

const eur = (n) => `${n.toFixed(2).replace(".", ",")} €`;

const esc = (t) => String(t).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const GUION = {
  episodio: "Episodio IV",
  titulo: "UNA NUEVA NÓMINA",
  parrafos: [
    "Es una época de incertidumbre. Un joven RESIDENTE ha comenzado su formación "
    + "en un hospital de la periferia, sin saber aún cuánto va a cobrar por las "
    + "guardias que le esperan.",
    "Mientras el ANEXO XVI fija el valor de cada hora, nadie ha sabido decirle si "
    + "el SAS parte las guardias a medianoche o las paga enteras a la tarifa del "
    + "día en que empiezan. Trece euros con sesenta y ocho céntimos penden de esa "
    + "respuesta.",
    "Perseguido por la duda, el residente ha construido este CUADRANTE para "
    + "calcular su destino antes de que llegue la nómina....",
  ],
};

function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function iniciar(raiz, almacen) {
  const estado = cargar(almacen);
  let pestana = "calendario";
  let mesVisible = hoyISO().slice(0, 7);
  let ajustesAbierto = false;
  // PDFs de nomina leidos en esta sesion, pendientes de revisar y confirmar
  // uno a uno; no se persisten hasta que el usuario pulsa "Anadir".
  let pendientesNomina = [];
  let estadoPdf = "";

  raiz.querySelector("#logo-app").src = LOGO_URI;

  let sesion = null; // { uid, nombre, correo, foto } | null

  // Repinta Ajustes cuando cambia el estado del guardado en la nube, pero
  // solo si esta abierto: no tiene sentido tocar la pantalla si el usuario
  // esta en el calendario. Dos canales independientes: el Artifact de Claude
  // (si la app vive ahi) y Firebase (si hay sesion de Google) — cualquiera
  // de los dos, o ninguno, puede estar disponible segun donde se abra la app.
  const repintarAjustesSiAbierto = () => { if (ajustesAbierto) abrirAjustes(); };
  const guardarRemoto = creaGuardadoRemoto(repintarAjustesSiAbierto);
  const guardarNube = creaGuardadoNube(repintarAjustesSiAbierto);
  const persistir = () => {
    estado.actualizadoEn = Date.now();
    guardar(almacen, estado);
    guardarRemoto(estado);
    guardarNube(estado);
  };

  // Se usa tanto para lo que llega del Artifact como de Firebase: solo se
  // adopta si es mas reciente que lo local, y pasa por la misma validacion
  // que la copia de seguridad pegada a mano.
  function adoptarRemoto(remoto) {
    if (!remoto || !esMasReciente(remoto, estado)) return;
    const resultado = importarEstado(JSON.stringify(remoto));
    if (!resultado.ok) return;
    const tema = estado.config.tema;
    // Antes de pisar lo local, se mira si la copia remota descarta ediciones
    // de este dispositivo: si es asi, la anterior queda guardada y se avisa.
    const previo = { ...estado };
    const habiaEdiciones = !mismaData(previo, resultado.estado);
    Object.assign(estado, resultado.estado);
    estado.config.tema = tema;
    estado.actualizadoEn = remoto.actualizadoEn || Date.now();
    guardar(almacen, estado);
    pintar();
    if (habiaEdiciones) {
      guardarPrevio(almacen, previo);
      avisarAdopcion();
    }
  }

  // Aviso no bloqueante cuando una copia remota mas reciente pisa ediciones
  // locales: la copia anterior quedo guardada y se ofrece restaurarla. Al
  // restaurar, la copia local vuelve a ser la mas reciente y se sincroniza.
  function avisarAdopcion() {
    const vista = raiz.querySelector("#vista");
    const nota = document.createElement("p");
    nota.className = "aviso";
    nota.textContent = "Se ha adoptado la copia más reciente de otro dispositivo. ";
    const boton = document.createElement("button");
    boton.type = "button";
    boton.textContent = "Restaurar mi copia anterior";
    boton.onclick = () => {
      const previo = cargarPrevio(almacen);
      if (!previo) return;
      const r = importarEstado(JSON.stringify(previo));
      if (!r.ok) return;
      const tema = estado.config.tema;
      Object.assign(estado, r.estado);
      estado.config.tema = tema;
      persistir(); // queda como la mas reciente: gana esta copia y se sincroniza
      pintar();
    };
    nota.appendChild(boton);
    vista.prepend(nota);
  }

  function pintar() {
    document.documentElement.dataset.tema = estado.config.tema || "sobrio";
    if (!estado.config.inicioResidencia) return pintarBienvenida();
    raiz.querySelector("#pestanas").hidden = false;
    raiz.querySelector("#pestanas").innerHTML = PESTANAS
      .map(({ clave, texto }) =>
        `<button data-pestana="${clave}" class="${clave === pestana ? "activo" : ""}">${texto}</button>`)
      .join("");
    const vista = raiz.querySelector("#vista");
    if (pestana === "calendario") vista.innerHTML = vistaCalendario();
    if (pestana === "festivos") vista.innerHTML = vistaFestivos();
    if (pestana === "nominas") vista.innerHTML = vistaNominas();
    if (pestana === "anual") vista.innerHTML = vistaAnual();
  }

  // La intro solo aparece en el primer arranque con el tema espacial, o cuando
  // se pide desde Ajustes. Siempre se puede saltar, y con reduccion de
  // movimiento activada se omite entera.
  function lanzarIntro(pedida = false) {
    const caja = raiz.querySelector("#intro");
    // La reduccion de movimiento del sistema significa "no me sueltes animaciones
    // sin avisar", no "no me dejes ver una que he pedido". Solo frena la
    // automatica del primer arranque.
    const sinMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (sinMovimiento && !pedida) return;

    caja.innerHTML = `
      <button id="intro-saltar">Saltar ▸</button>
      <p class="intro-lejos">Hace mucho tiempo, en un hospital muy, muy lejano....</p>
      <div class="intro-logo">Cuadrante</div>
      <div class="intro-espacio">
        <div class="intro-crawl">
          <p class="intro-episodio">${GUION.episodio}</p>
          <h2 class="intro-titulo">${GUION.titulo}</h2>
          ${GUION.parrafos.map((p) => `<p>${p}</p>`).join("")}
        </div>
      </div>`;
    caja.hidden = false;
    document.body.classList.add("con-intro");

    const cerrar = () => {
      caja.hidden = true;
      caja.innerHTML = "";
      document.body.classList.remove("con-intro");
      clearTimeout(reloj);
      document.removeEventListener("keydown", porTecla);
    };
    const porTecla = (ev) => { if (ev.key === "Escape" || ev.key === " ") cerrar(); };
    const reloj = setTimeout(cerrar, 38000);
    caja.onclick = cerrar;
    document.addEventListener("keydown", porTecla);
  }

  function pintarBienvenida() {
    raiz.querySelector("#pestanas").hidden = true;
    raiz.querySelector("#vista").innerHTML = `
      <div class="tarjeta">
        <img class="logo-bienvenida" src="${LOGO_URI}" alt="">
        <strong class="etiqueta">Empecemos</strong>
        <div class="crawl"><p>Para calcular tus guardias necesito saber cuándo empezaste
           la residencia. De esa fecha salen tu año (R1 a R5) y las tarifas que te
           corresponden.</p></div>
        <p class="etiqueta-campo">Fecha de inicio</p>
        <input type="date" id="b-inicio" value="">
        <div class="acciones-modal">
          <button class="primario" id="b-empezar">Empezar</button>
        </div>
        <p class="aviso">Puedes cambiarla después en Ajustes.</p>
      </div>`;
  }

  function vistaCalendario() {
    const [anio, mes] = mesVisible.split("-").map(Number);
    const dias = diasDelMes(mesVisible);
    const hueco = (diaSemana(dias[0]) + 6) % 7; // lunes primero
    const celdas = ['<div aria-hidden="true"></div>'.repeat(hueco)];
    const hoy = hoyISO();
    for (const fecha of dias) {
      const g = estado.guardias[fecha];
      const num = Number(fecha.slice(8));
      let clases = "dia";
      if (fecha === hoy) clases += " hoy";
      let detalle = "";
      if (g) {
        const r = calcularGuardia({ ...g, fecha }, estado.festivos, estado.config);
        const tipos = [...new Set(r.tramos.map((t) => t.tipo))];
        clases += ` ${tipos[0]}`;
        if (!g.hecha) clases += " prevista";
        detalle = `<span class="horas">${g.horas}h</span>`;
        if (g.lugar) detalle += `<span class="lugar">${g.lugar}</span>`;
        if (tipos.length > 1) detalle += `<span class="cruza">cruza</span>`;
      }
      celdas.push(`<button type="button" class="${clases}" data-fecha="${fecha}" aria-label="${fecha}"><span class="num">${num}</span>${detalle}</button>`);
    }
    const r = resumenMes(mesVisible, estado);
    const p = previsionIngreso(mesVisible, estado);
    const c = compararHipotesis(mesVisible, estado);
    const sinMarcar = Object.entries(estado.guardias)
      .filter(([f, g]) => f.slice(0, 7) === mesVisible && !g.hecha).length;

    // El tipo de las guardias se calibra con una nomina concreta, y parte de la
    // cotizacion esta topada: en un mes con bastantes mas guardias que aquella,
    // el descuento real es proporcionalmente menor y el neto sale corto.
    const refGuardias = historialTipos(estado.nominas, "guardias").slice(-1)[0];
    const netoCorto = refGuardias && r.brutoGuardias > refGuardias.bruto * 1.25;

    return `
      <div class="tarjeta">
        <div class="cabecera-mes">
          <button class="nav-mes" data-mes="-1">‹</button>
          <strong class="mes-titulo">${MESES[mes - 1]} <span class="mes-anio">${anio}</span></strong>
          <button class="nav-mes" data-mes="1">›</button>
        </div>
        <div class="rejilla" style="margin:.75rem 0">
          ${["L", "M", "X", "J", "V", "S", "D"].map((d) => `<div class="cabecera-semana">${d}</div>`).join("")}
        </div>
        <div class="rejilla">${celdas.join("")}</div>
        <p class="aviso">Las guardias con borde punteado aún no están marcadas como
          realizadas: cuentan como previsión.</p>
      </div>
      <div class="tarjeta">
        <strong class="etiqueta">Resumen de ${MESES[mes - 1]}</strong>
        <table>
          <tr><td>Sueldo base</td><td class="cifra">${eur(r.brutoBase)}</td></tr>
          ${filaTipo("laborable", r)}${filaTipo("sdf", r)}${filaTipo("especial", r)}
          <tr><td>Bruto total</td><td class="cifra">${eur(r.bruto)}</td></tr>
          <tr><td>Guardias confirmadas</td><td class="cifra">${eur(r.brutoConfirmado)}</td></tr>

  // Redondeo de dos decimales con coma, para prellenar inputs con el mismo
  // formato que espera el usuario al escribir a mano (no el punto de JS).
  // null pasa a cadena vacia: puede llegar de sincronizar una tarjeta cuyo
  // campo opcional el usuario borro a mano antes de anadir otro PDF.
  const cifra = (n) => (n == null ? "" : n.toFixed(2).replace(".", ","));

  // Comparte las reglas de validacion entre el alta manual y las tarjetas de
  // revision de PDF: un solo sitio donde tocarlas si cambian.
  function construirNomina({ periodo, clase, bruto, neto, cotizacion, irpf }) {
    if (!/^\d{4}-\d{2}$/.test(periodo)) {
      return { ok: false, error: "El periodo se escribe como 2026-09." };
    }
    if (!(bruto > 0) || !(neto > 0)) {
      return { ok: false, error: "Bruto y neto tienen que ser mayores que cero." };
    }
    if (neto > bruto) {
      return { ok: false, error: "El neto no puede ser mayor que el bruto." };
    }
    const nomina = { periodo, clase, bruto: redondear(bruto), neto: redondear(neto) };
    // Cero es un valor legitimo: hasta la primera regularizacion el IRPF de
    // un residente suele ser 0. Por eso se mira si el campo esta vacio, no
    // si vale mas que cero.
    const hayDesglose = cotizacion !== null || irpf !== null;
    if (hayDesglose) {
      if (cotizacion === null || irpf === null) {
        return { ok: false, error: "Si desglosas, pon las dos: cotización e IRPF. Si una es cero, escribe 0." };
      }
      if (!(cotizacion >= 0) || !(irpf >= 0)) {
        return { ok: false, error: "La cotización y el IRPF no pueden ser negativos." };
      }
      if (Math.abs(cotizacion + irpf - (bruto - neto)) > 0.02) {
        return {
          ok: false,
          error: `Cotización + IRPF son ${eur(redondear(cotizacion + irpf))}, `
            + `pero del bruto al neto van ${eur(redondear(bruto - neto))}. Revísalo.`,
        };
      }
      nomina.cotizacion = redondear(cotizacion);
      nomina.irpf = redondear(irpf);
    }
    return { ok: true, nomina };
  }

  // Lee los campos de un formulario de nomina del DOM. `idDe` traduce cada
  // nombre de campo a su selector: el alta manual y cada tarjeta pendiente
  // usan ids distintos (fijos una, con el indice la otra), pero los campos
  // son los mismos, asi que la lectura tambien puede serlo.
  function leerNomina(idDe) {
    const leer = (id) => raiz.querySelector(id).value.replace(",", ".");
    const cotTexto = raiz.querySelector(idDe("cotizacion")).value.trim();
    const irpfTexto = raiz.querySelector(idDe("irpf")).value.trim();
    return {
      periodo: raiz.querySelector(idDe("periodo")).value.trim(),
      clase: raiz.querySelector(idDe("clase")).value,
      bruto: Number(leer(idDe("bruto"))),
      neto: Number(leer(idDe("neto"))),
      cotizacion: cotTexto === "" ? null : Number(cotTexto.replace(",", ".")),
      irpf: irpfTexto === "" ? null : Number(irpfTexto.replace(",", ".")),
    };
  }

  // Una tarjeta de revision por PDF leido: los campos ya vienen rellenos pero
  // editables, y no se guarda nada hasta que se pulsa "Anadir" en la propia
  // tarjeta. Si el PDF no se pudo parsear, se enseña el motivo en su lugar.
  function vistaPendiente(p, i) {
    if (!p.ok) {
      return `<div class="tarjeta">
        <strong class="etiqueta">${esc(p.nombreArchivo)}</strong>

    }
    const d = p.datos;
    return `<div class="tarjeta">
      <strong class="etiqueta">${esc(p.nombreArchivo)}</strong>
      <div class="formulario">
        <input id="pend-periodo-${i}" value="${esc(d.periodo)}" size="8">
        <select id="pend-clase-${i}">
          <option value="base" ${d.clase === "base" ? "selected" : ""}>Base</option>
          <option value="guardias" ${d.clase === "guardias" ? "selected" : ""}>Guardias</option>
        </select>
        <input id="pend-bruto-${i}" value="${cifra(d.bruto)}" size="8">
        <input id="pend-neto-${i}" value="${cifra(d.neto)}" size="8">
      </div>
      <div class="formulario">
        <input id="pend-cotizacion-${i}" value="${cifra(d.cotizacion)}" size="10">
        <input id="pend-irpf-${i}" value="${cifra(d.irpf)}" size="8">
        <button class="primario" data-pend-anadir="${i}">Añadir</button>
        <button data-pend-descartar="${i}">Descartar</button>
      </div>
      <p class="aviso" id="pend-error-${i}"></p></div>`;

  function vistaNominas() {
    const t = tiposEfectivos(estado.nominas, estado.config);
    const filas = estado.nominas.map((n, i) => `

      <button class="peligro" data-borrar-nomina="${i}">×</button></td></tr>`).join("");
    return `<div class="tarjeta"><strong class="etiqueta">Nóminas registradas</strong>
      <table>${filas}</table>

      <div class="formulario">
        <input type="file" id="n-pdf-input" accept="application/pdf" multiple>
      </div>
      ${estadoPdf ? `<p class="aviso">${esc(estadoPdf)}</p>` : ""}
      ${pendientesNomina.map(vistaPendiente).join("")}
      <div class="formulario">
        <input id="n-periodo" placeholder="2026-09" size="8">
        <select id="n-clase"><option value="base">Base</option><option value="guardias">Guardias</option></select>
        <input id="n-bruto" placeholder="Bruto" size="8">

      </div>

        <input id="n-cotizacion" placeholder="Cotización €" size="10">
        <input id="n-irpf" placeholder="IRPF €" size="8">
      </div>
      <p class="aviso" id="n-error">Los dos últimos son opcionales, pero si los
        copias de la nómina puedo separar lo fijo (cotización) de lo que varía (IRPF).</p></div>`;
  }

  // El tipo de IRPF se regulariza y puede moverse mes a mes. Se enseña la deriva
  // en vez de un solo numero, y se marcan los saltos grandes.
  function bloqueRetencion(clase, titulo, tipoVigente, cuantas) {
    const h = historialTipos(estado.nominas, clase);
    if (h.length === 0) {
      return `<p class="tenue">Retención de ${titulo.toLowerCase()}:
        <strong>${(tipoVigente * 100).toFixed(2)} %</strong> — valor por defecto,
        aún sin nóminas registradas.</p>`;
    }
    const pasos = h.map((f, i) => {
      const ultimo = i === h.length - 1;
      // Con desglose se enseña el IRPF, que es lo que deriva; la cotizacion va
      // aparte y en tenue, porque es de tipo fijo y no dice nada nuevo.
      const cifra = f.tipoIrpf !== null
        ? `<b>${(f.tipoIrpf * 100).toFixed(2)} %</b><span class="fijo">+${(f.tipoCotizacion * 100).toFixed(2)} cot.</span>`
        : `<b>${(f.tipo * 100).toFixed(2)} %</b>`;
      const marca = f.esSalto
        ? `<span class="salto">${f.salto > 0 ? "▲" : "▼"} ${Math.abs(f.salto * 100).toFixed(2)}</span>`
        : "";
      const aviso = f.cuadra ? "" : `<span class="salto" title="El desglose no cuadra con el neto">⚠</span>`;
      return `<span class="paso${ultimo ? " vigente" : ""}">${esc(f.periodo)}
        ${cifra}${marca}${aviso}</span>`;
    }).join('<span class="flecha">→</span>');
    const saltos = h.filter((f) => f.esSalto);
    const desglosadas = h.filter((f) => f.tipoIrpf !== null).length;
    return `
      <p class="etiqueta-campo">Retención de ${titulo.toLowerCase()}</p>
      <div class="historial">${pasos}</div>
      ${saltos.length ? `<p class="aviso">El tipo cambió de golpe en
        ${saltos.map((s) => esc(s.periodo)).join(", ")}. Suele ser una regularización
        de Hacienda: las previsiones de los meses anteriores se quedaron
        ${saltos[saltos.length - 1].salto > 0 ? "largas" : "cortas"}.</p>`
        : `<p class="aviso">Estable en ${cuantas} ${cuantas === 1 ? "nómina" : "nóminas"}.
        Se usa el último valor para las previsiones.${desglosadas === 0
          ? " Si copias la cotización y el IRPF de tu nómina, puedo seguir solo la parte que varía."
          : ""}</p>`}`;
  }

  function vistaAnual() {
    const anio = Number(mesVisible.slice(0, 4));
    const r = resumenAnio(anio, estado);
    return `<div class="tarjeta"><strong class="etiqueta">Resumen de ${anio}</strong><table>
      <tr><td><span class="punto punto-laborable"></span>Horas laborables</td><td class="cifra">${r.horasPorTipo.laborable}h</td></tr>
      <tr><td><span class="punto punto-sdf"></span>Horas festivas (S-D-F)</td><td class="cifra">${r.horasPorTipo.sdf}h</td></tr>
      <tr><td><span class="punto punto-especial"></span>Horas de festivo especial</td><td class="cifra">${r.horasPorTipo.especial}h</td></tr>

  function abrirModal(fecha) {
    // Una guardia nueva arranca con lo que toca ese dia; una ya guardada, con lo suyo.
    const sugerida = sugerenciaPara(fecha, estado.festivos);
    const g = { ...(estado.guardias[fecha]
      || { horas: sugerida.horas, inicio: sugerida.inicio, lugar: "", hecha: false }) };
    const caja = raiz.querySelector("#caja-modal");

    function pintarModal() {
      const r = calcularGuardia({ ...g, fecha }, estado.festivos, estado.config);
      const tipos = [...new Set(r.tramos.map((t) => t.tipo))];
      const tramos = r.tramos.map((t) => `<tr><td>${t.fecha} ${t.desde}–${t.hasta}</td>
        <td class="cifra">${t.horas}h × ${eur(t.tarifa)} = ${eur(t.importe)}</td></tr>`).join("");
      caja.innerHTML = `
        <strong class="modal-fecha">${fecha}</strong>
        <p class="etiqueta-campo">Duración</p>
        <div class="chips">${DURACIONES.map((h) => `<button data-horas="${h}" class="${g.horas === h ? "activo" : ""}">${h}h</button>`).join(" ")}</div>
        <p class="etiqueta-campo">Hora de inicio <input id="m-inicio" value="${g.inicio}" size="5"></p>
        <p class="etiqueta-campo">Lugar</p>
        <div class="chips">${LUGARES.map((l) => `<button data-lugar="${l.sigla}" class="${g.lugar === l.sigla ? "activo" : ""}">${l.nombre}</button>`).join(" ")}
             <button data-lugar="" class="${g.lugar === "" ? "activo" : ""}">sin especificar</button></div>
        <p><label><input type="checkbox" id="m-hecha" ${g.hecha ? "checked" : ""}> Guardia ya realizada</label></p>
        <table style="margin-top:.75rem">${tramos}
          <tr><td class="total">bruto</td><td class="cifra total">${eur(r.bruto)}</td></tr></table>
        ${tipos.length > 1 ? `<p class="aviso">${AVISO_SIN_VERIFICAR}</p>` : ""}
        <div class="acciones-modal">
          <button class="peligro" id="m-borrar">Borrar</button>
          <button id="m-cancelar">Cancelar</button>
          <button class="primario" id="m-guardar">Guardar</button>
        </div>`;
    }

    caja.onclick = (ev) => {
      const b = ev.target.closest("button");
      if (!b) return;
      // Cambiar la duracion ya no toca la hora de entrada: esa depende del dia,
      // no de lo que dure la guardia.
      if (b.dataset.horas) { g.horas = Number(b.dataset.horas); pintarModal(); }
      else if ("lugar" in b.dataset) { g.lugar = b.dataset.lugar; pintarModal(); }
      else if (b.id === "m-cancelar") cerrarModal();
      else if (b.id === "m-borrar") { delete estado.guardias[fecha]; persistir(); cerrarModal(); pintar(); }
      else if (b.id === "m-guardar") {
        const valorInicio = caja.querySelector("#m-inicio").value;
        if (/^([01]\d|2[0-3]):[0-5]\d$/.test(valorInicio)) g.inicio = valorInicio;
        g.hecha = caja.querySelector("#m-hecha").checked;
        estado.guardias[fecha] = g; persistir(); cerrarModal(); pintar();
      }
    };
    caja.oninput = (ev) => {
      if (ev.target.id === "m-inicio" && /^([01]\d|2[0-3]):[0-5]\d$/.test(ev.target.value)) {
        g.inicio = ev.target.value;
        const foco = ev.target.selectionStart;
        pintarModal();
        const campo = caja.querySelector("#m-inicio");
        campo.focus();
        campo.setSelectionRange(foco, foco);
      }
    };
    pintarModal();
    raiz.querySelector("#modal").classList.add("abierto");
  }

  function cerrarModal() {
    ajustesAbierto = false;
    raiz.querySelector("#modal").classList.remove("abierto");

  // Dos canales posibles: Firebase (si hay sesion de Google, sincroniza de
  // verdad entre dispositivos) y el Artifact de Claude (solo si la app vive
  // ahi). Se prioriza Firebase en el mensaje porque es el que el usuario
  // controla con su sesion; el del Artifact es un extra silencioso.
  function textoEstadoGuardado() {
    if (sesion) {
      const e = guardarNube.estadoActual;
      if (e === "al-dia") return "Copia en la nube (Google): al día.";
      if (e === "pendiente") return "Copia en la nube (Google): guardando…";
      if (e === "comprobando") return "Copia en la nube (Google): comprobando…";
      return "Copia en la nube (Google): no disponible ahora mismo. Tus datos siguen "
        + "a salvo en este navegador.";
    }
    const e = guardarRemoto.estadoActual;
    if (e === "al-dia") {
      return "Copia en el Artifact: al día. Inicia sesión con Google arriba para "
        + "sincronizar entre dispositivos.";
    }
    if (e === "pendiente") return "Copia en el Artifact: guardando…";
    return "Sin copia en la nube activa. Inicia sesión con Google arriba para "
      + "sincronizar entre dispositivos, o copia este texto como respaldo.";
  }
