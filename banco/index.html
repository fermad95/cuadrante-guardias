<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de pruebas</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; margin: 1.5rem; background: Canvas; color: CanvasText; }
  table { border-collapse: collapse; margin-top: 1rem; }
  td { padding: .3rem .6rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); vertical-align: top; }
  .ok { color: #2e8b57; font-weight: 700; } .fallo { color: #d0342c; font-weight: 700; }
  #marco iframe { width: 390px; height: 700px; border: 1px solid #888; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Banco de pruebas de sincronización</h1>
<p>La app real con un Firebase simulado. Comprueba que cambiar de cuenta de Google en el mismo
  dispositivo nunca mezcla datos ni escribe en la nube de quien no es, y que sincronizar entre
  dispositivos no pierde nada. Tarda algo más de un minuto.</p>
<button id="lanzar">Ejecutar los escenarios</button>
<p id="resumen"></p>
<table id="resultados"></table>
<div id="marco"></div>
<script type="module">
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
const orden = (x) => Array.isArray(x) ? x.map(orden)
  : x && typeof x === "object" ? Object.fromEntries(Object.keys(x).sort().map((k) => [k, orden(x[k])])) : x;
const mismos = (x, y) => !!x && !!y && ["guardias", "nominas", "festivos"]
  .every((k) => JSON.stringify(orden(x[k])) === JSON.stringify(orden(y[k])));

let E; // { clave, A, B }
const filas = [];
function comprobar(escenario, que, ok) {
  filas.push({ escenario, que, ok: !!ok });
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${escenario}</td><td>${que}</td><td class="${ok ? "ok" : "fallo"}">${ok ? "OK" : "FALLO"}</td>`;
  document.getElementById("resultados").appendChild(tr);
}

// `base`: { uid: estado } con lo ultimo que el dispositivo supo de la nube de esa cuenta.
function preparar({ local, cuenta, fb, base }) {
  localStorage.clear();
  sessionStorage.clear();
  if (local) localStorage.setItem(E.clave, JSON.stringify(local));
  if (cuenta) localStorage.setItem(`${E.clave}_cuenta`, cuenta);
  for (const [uid, dato] of Object.entries(base || {})) localStorage.setItem(`${E.clave}_base_${uid}`, JSON.stringify(dato));
  sessionStorage.setItem("__FB_init", JSON.stringify(fb));
}

async function abrir() {
  const f = document.createElement("iframe");
  f.src = `app.html?${Math.random()}`;
  document.getElementById("marco").replaceChildren(f);
  await new Promise((r) => { f.onload = r; });
  await esperar(1500);
  return f.contentWindow;
}

const local = () => JSON.parse(localStorage.getItem(E.clave));

async function cambiarA(w, uid) {
  w.__FB.logout();
  await esperar(150);
  w.__FB.login(uid, `${uid}@prueba`);
  await esperar(1500);
}

// Apunta una guardia en el primer dia libre del mes siguiente al visible.
async function añadirGuardia(w) {
  const d = w.document;
  d.querySelector('[data-mes="1"]').click(); await esperar(150);
  const dia = [...d.querySelectorAll("[data-fecha]")].find((b) => !b.querySelector(".horas"));
  const fecha = dia.dataset.fecha;
  dia.click(); await esperar(250);
  d.querySelector("#m-guardar").click(); await esperar(100);
  return fecha;
}

const escenarios = {
  async "1. Cambio de A a B y vuelta"() {
    const n = "1. A → B → A";
    preparar({ local: E.A, cuenta: "uidA", fb: { user: { uid: "uidA" }, docs: { uidA: E.A, uidB: E.B } } });
    const w = await abrir();
    comprobar(n, "arranca con los datos de A", mismos(local(), E.A));
    await cambiarA(w, "uidB");
    comprobar(n, "al entrar en B se ven los datos de B", mismos(local(), E.B));
    comprobar(n, "los datos de A quedan como respaldo de A", mismos(JSON.parse(localStorage.getItem(`${E.clave}_respaldo_uidA`)), E.A));
    await esperar(3500);
    comprobar(n, "no se escribe nada en ninguna nube", w.__FB.escrituras.length === 0);
    await cambiarA(w, "uidA");
    comprobar(n, "al volver a A se ven sus datos", mismos(local(), E.A));
    await esperar(3000);
    comprobar(n, "las dos nubes quedan intactas", mismos(w.__FB.docs.uidA, E.A) && mismos(w.__FB.docs.uidB, E.B));
  },

  async "2. Version antigua con un cambio sin subir"() {
    const n = "2. Guardado pendiente";
    preparar({ local: E.A, fb: { user: { uid: "uidA" }, docs: { uidA: E.A, uidB: E.B } } }); // sin clave de cuenta
    const w = await abrir();
    comprobar(n, "la version nueva anota que los datos son de A", localStorage.getItem(`${E.clave}_cuenta`) === "uidA");
    const d = w.document;
    for (let i = 0; i < 2; i++) { d.querySelector('[data-mes="1"]').click(); await esperar(150); }
    const dia = d.querySelector("[data-fecha]:not(.guardia)") || d.querySelector("[data-fecha]");
    const fecha = dia.dataset.fecha;
    dia.click(); await esperar(250);
    d.querySelector("#m-guardar").click(); await esperar(100);
    comprobar(n, "la guardia nueva se guarda en local", fecha in local().guardias);
    await cambiarA(w, "uidB"); // antes de que venza el guardado (2,5 s)
    await esperar(3000);
    comprobar(n, "la guardia de A no llega a la nube de B", !(fecha in (w.__FB.docs.uidB.guardias || {})));
    await cambiarA(w, "uidA");
    await esperar(3500);
    comprobar(n, "al volver a A, la guardia se recupera", fecha in local().guardias);
    comprobar(n, "y se sube a la nube de A", fecha in w.__FB.docs.uidA.guardias);
  },

  async "3. Cuenta con datos de una version antigua"() {
    const n = "3. B con datos antiguos";
    preparar({ fb: { user: null, docs: { uidA: E.A, uidB: E.B } } });
    const w = await abrir();
    w.__FB.login("uidB", "uidB@prueba");
    await esperar(1500);
    comprobar(n, "carga los datos de B tal cual", mismos(local(), E.B));
    await esperar(3000);
    comprobar(n, "no escribe nada al entrar", w.__FB.escrituras.length === 0);
  },

  async "4. Cuenta nueva sin datos"() {
    const n = "4. B vacía";
    preparar({ local: E.A, cuenta: "uidA", fb: { user: { uid: "uidA" }, docs: { uidA: E.A } } });
    const w = await abrir();
    await cambiarA(w, "uidB");
    const l = local();
    comprobar(n, "empieza en blanco", Object.keys(l.guardias).length === 0 && l.nominas.length === 0 && l.config.inicioResidencia === null);
    await esperar(3000);
    comprobar(n, "no hereda nada de A en su nube", w.__FB.escrituras.length === 0);
  },

  async "5. Cambio de cuenta sin conexión"() {
    const n = "5. Sin red";
    preparar({ local: E.A, cuenta: "uidA", fb: { user: { uid: "uidA" }, docs: { uidA: E.A, uidB: E.B } } });
    const w = await abrir();
    w.__FB.falloLectura = true;
    await cambiarA(w, "uidB");
    comprobar(n, "avisa de que no puede cargar la cuenta", /No se han podido cargar/.test(w.document.querySelector("#vista").innerText));
    comprobar(n, "la copia sigue siendo de A", localStorage.getItem(`${E.clave}_cuenta`) === "uidA");
    await esperar(3500);
    comprobar(n, "no escribe en ninguna nube", w.__FB.escrituras.length === 0);
  },

  async "6. Movil nuevo: fecha de inicio antes de iniciar sesion"() {
    const n = "6. Móvil nuevo";
    preparar({ fb: { user: null, docs: { uidA: E.A } } });
    const w = await abrir();
    const d = w.document;
    d.querySelector("#b-inicio").value = "2026-05-27";
    d.querySelector("#b-empezar").click(); await esperar(200);
    d.querySelector("#intro")?.click(); await esperar(100);
    comprobar(n, "la copia local (casi vacia) es mas reciente que la nube", local().actualizadoEn > E.A.actualizadoEn && Object.keys(local().guardias).length === 0);
    w.__FB.login("uidA", "uidA@prueba");
    await esperar(1500);
    comprobar(n, "al iniciar sesion se cargan los datos de la cuenta", mismos(local(), E.A));
    await añadirGuardia(w);
    await esperar(3500);
    comprobar(n, "la nube conserva todo lo que tenia", Object.keys(E.A.guardias).every((f) => f in w.__FB.docs.uidA.guardias)
      && w.__FB.docs.uidA.nominas.length === E.A.nominas.length);
    comprobar(n, "y ademas la guardia nueva", Object.keys(w.__FB.docs.uidA.guardias).length === Object.keys(E.A.guardias).length + 1);
  },

  async "7. Cambio hecho sin cobertura"() {
    const n = "7. Sin subir al cerrar";
    const conCambio = { ...E.A, actualizadoEn: E.A.actualizadoEn + 500, guardias: { ...E.A.guardias, "2026-09-20": { horas: 24, inicio: "09:00", lugar: "", hecha: false } } };
    preparar({ local: conCambio, cuenta: "uidA", base: { uidA: E.A }, fb: { user: { uid: "uidA" }, docs: { uidA: E.A } } });
    const w = await abrir();
    await esperar(1000);
    comprobar(n, "al volver a abrir con conexion se sube sin tocar nada", "2026-09-20" in w.__FB.docs.uidA.guardias);
    comprobar(n, "una sola escritura", w.__FB.escrituras.length === 1);
    comprobar(n, "el local no cambia", "2026-09-20" in local().guardias && mismos(local(), conCambio));
  },

  async "8. App abierta con datos de ayer"() {
    const n = "8. Dos dispositivos";
    preparar({ local: E.A, cuenta: "uidA", base: { uidA: E.A }, fb: { user: { uid: "uidA" }, docs: { uidA: E.A } } });
    const w = await abrir();
    comprobar(n, "arranca sin escribir", w.__FB.escrituras.length === 0);
    // Otro dispositivo sube una nomina y una guardia mientras este sigue abierto.
    const otra = { periodo: "2026-10", clase: "base", bruto: 1379.9, neto: 1182.78 };
    w.__FB.docs.uidA = { ...E.A, actualizadoEn: Date.now(), nominas: [...E.A.nominas, otra],
      guardias: { ...E.A.guardias, "2026-10-03": { horas: 24, inicio: "09:00", lugar: "", hecha: false } } };
    const fecha = await añadirGuardia(w);
    await esperar(3500);
    const nube = w.__FB.docs.uidA;
    comprobar(n, "la guardia de este dispositivo llega a la nube", fecha in nube.guardias);
    comprobar(n, "sin borrar la guardia del otro", "2026-10-03" in nube.guardias);
    comprobar(n, "ni su nomina", nube.nominas.some((x) => x.periodo === "2026-10" && x.clase === "base"));
    comprobar(n, "y este dispositivo tambien las ve", "2026-10-03" in local().guardias && local().nominas.length === E.A.nominas.length + 1);
    const escritas = w.__FB.escrituras.length;
    w.document.dispatchEvent(new Event("visibilitychange"));
    await esperar(1000);
    comprobar(n, "ya iguales, volver a primer plano no escribe", w.__FB.escrituras.length === escritas);
  },

  async "9. Borrados"() {
    const n = "9. Borrar";
    preparar({ local: E.A, cuenta: "uidA", base: { uidA: E.A }, fb: { user: { uid: "uidA" }, docs: { uidA: E.A } } });
    const w = await abrir();
    const d = w.document;
    // Otro dispositivo borra una guardia; este borra otra distinta.
    const { "2026-07-08": _, ...sinLaDel8 } = E.A.guardias;
    w.__FB.docs.uidA = { ...E.A, actualizadoEn: Date.now(), guardias: sinLaDel8 };
    while (!d.querySelector('[data-fecha="2026-08-11"]')) { d.querySelector('[data-mes="-1"]').click(); await esperar(150); }
    d.querySelector('[data-fecha="2026-08-11"]').click(); await esperar(250);
    d.querySelector("#m-borrar").click();
    await esperar(3500);
    const nube = w.__FB.docs.uidA.guardias;
    comprobar(n, "los dos borrados se respetan", !("2026-07-08" in nube) && !("2026-08-11" in nube));
    comprobar(n, "y no se borra nada mas", Object.keys(nube).length === Object.keys(E.A.guardias).length - 2);
    comprobar(n, "local y nube dicen lo mismo", mismos(local(), w.__FB.docs.uidA));
  },
};

document.getElementById("lanzar").onclick = async () => {
  E = await (await fetch(`estados.json?${Date.now()}`, { cache: "no-store" })).json();
  filas.length = 0;
  document.getElementById("resultados").replaceChildren();
  document.getElementById("resumen").textContent = "Ejecutando…";
  for (const [nombre, fn] of Object.entries(escenarios)) {
    try { await fn(); } catch (e) { comprobar(nombre, `error: ${e.message}`, false); }
  }
  localStorage.clear();
  sessionStorage.clear();
  const fallos = filas.filter((f) => !f.ok).length;
  document.getElementById("resumen").innerHTML = fallos === 0
    ? `<span class="ok">Todo correcto: ${filas.length} comprobaciones.</span>`
    : `<span class="fallo">${fallos} de ${filas.length} comprobaciones fallan.</span>`;
  window.resultadoBanco = { total: filas.length, fallos, filas };
};
</script>
</body>
</html>
